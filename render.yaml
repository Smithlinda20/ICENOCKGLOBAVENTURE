services:
  - type: web
    name: ice-nock-sales
    env: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: ADMIN_USERNAME
        value: "Admin1"
      - key: ADMIN_EMAIL
        value: "abdulazizmohammedbello4@gmail.com"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: new_silver
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.4"

databases:
  - name: new_silver
    plan: starter
