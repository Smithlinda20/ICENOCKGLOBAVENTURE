{% extends "base.html" %}
{% load static %}
{% block title %}New Sale &middot; {{ store_settings.company_name }}{% endblock %}
{% block extra_head %}
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
{% endblock %}

{% block content %}
{{ products_json|json_script:"products-data" }}
<div x-data="posApp()" x-init="init()" class="grid lg:grid-cols-3 gap-6">

  <!-- Product picker -->
  <div class="lg:col-span-2 space-y-4">
    <div class="card p-4">
      <input type="text" x-model="query" placeholder="Search product by name or SKU..."
             class="input text-base" autofocus>
      <div class="grid sm:grid-cols-2 gap-3 mt-4 max-h-[65vh] overflow-y-auto pr-1">
        <template x-for="p in filteredProducts()" :key="p.id">
          <button type="button" @click="addToCart(p)"
                  class="text-left border border-slate-200 rounded-xl p-3 hover:border-brand hover:shadow-sm transition bg-white">
            <div class="font-semibold text-sm" x-text="p.name"></div>
            <div class="text-xs text-slate-500" x-text="'SKU: ' + p.sku"></div>
            <div class="flex justify-between mt-2 text-xs">
              <span class="text-slate-600">Pack: <span class="font-semibold text-ink" x-text="'₦' + Number(p.pack_price).toLocaleString()"></span></span>
              <span class="text-slate-600">Carton: <span class="font-semibold text-ink" x-text="'₦' + Number(p.carton_price).toLocaleString()"></span></span>
            </div>
            <div class="text-[11px] mt-1" :class="p.current_stock <= 0 ? 'text-red-600' : 'text-slate-400'"
                 x-text="'Stock: ' + p.current_stock + ' pack unit(s)'"></div>
          </button>
        </template>
        <template x-if="filteredProducts().length === 0">
          <p class="text-sm text-slate-400 col-span-2 py-6 text-center">No matching products.</p>
        </template>
      </div>
    </div>
  </div>

  <!-- Cart / checkout -->
  <div class="space-y-4">
    <div class="card p-4">
      <h2 class="font-bold text-sm mb-3 text-slate-700">Current Sale</h2>
      <div class="space-y-3 max-h-[38vh] overflow-y-auto pr-1">
        <template x-for="(line, idx) in cart" :key="line.uid">
          <div class="border border-slate-200 rounded-lg p-3">
            <div class="flex justify-between items-start gap-2">
              <div class="text-sm font-semibold" x-text="line.name"></div>
              <button type="button" @click="removeLine(idx)" class="text-red-500 text-xs font-medium">Remove</button>
            </div>
            <div class="flex items-center gap-2 mt-2">
              <select class="input !py-1 !text-xs w-28" x-model="line.unit_type" @change="refreshLine(line)">
                <option value="PACK">PACK</option>
                <option value="CARTON">CARTON</option>
              </select>
              <div class="flex items-center border border-slate-200 rounded-md">
                <button type="button" class="px-2 py-1 text-sm" @click="line.quantity = Math.max(1, line.quantity - 1); refreshLine(line)">−</button>
                <input type="number" min="1" class="w-12 text-center text-sm border-0 focus:ring-0" x-model.number="line.quantity" @change="refreshLine(line)">
                <button type="button" class="px-2 py-1 text-sm" @click="line.quantity = line.quantity + 1; refreshLine(line)">+</button>
              </div>
            </div>
            <div class="text-xs text-slate-500 mt-2 space-y-0.5">
              <div class="flex justify-between"><span>Unit price</span><span x-text="'₦' + Number(line.unit_price || 0).toLocaleString()"></span></div>
              <div class="flex justify-between"><span>Gross</span><span x-text="'₦' + Number(line.gross_amount || 0).toLocaleString()"></span></div>
              <div class="flex justify-between text-emerald-600" x-show="line.discount_amount > 0"><span>Discount</span><span x-text="'-₦' + Number(line.discount_amount || 0).toLocaleString()"></span></div>
              <div class="flex justify-between font-semibold text-ink"><span>Line total</span><span x-text="'₦' + Number(line.net_amount || 0).toLocaleString()"></span></div>
            </div>
          </div>
        </template>
        <template x-if="cart.length === 0">
          <p class="text-sm text-slate-400 text-center py-6">Cart is empty. Tap a product to add it.</p>
        </template>
      </div>
    </div>

    <div class="card p-4 space-y-3">
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Customer name (optional)</label>
        <input type="text" x-model="customerName" class="input">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Customer WhatsApp / phone (optional)</label>
        <input type="text" x-model="customerPhone" placeholder="0803..." class="input">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Payment method</label>
        <select x-model="paymentMethod" class="input">
          {% for value, label in payment_methods %}
          <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Extra discount (₦)</label>
          <input type="number" min="0" step="0.01" x-model.number="manualDiscount" class="input">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Amount paid (₦)</label>
          <input type="number" min="0" step="0.01" x-model.number="amountPaid" class="input" :placeholder="grandTotal().toFixed(2)">
        </div>
      </div>
      <div x-show="manualDiscount > 0">
        <label class="block text-xs font-medium text-slate-500 mb-1">Reason for extra discount</label>
        <input type="text" x-model="manualDiscountReason" class="input">
      </div>

      <div class="border-t border-dashed border-slate-200 pt-3 space-y-1 text-sm">
        <div class="flex justify-between"><span class="text-slate-500">Subtotal</span><span x-text="'₦' + subtotal().toLocaleString()"></span></div>
        <div class="flex justify-between text-emerald-600"><span>Discount</span><span x-text="'-₦' + totalDiscount().toLocaleString()"></span></div>
        <div class="flex justify-between text-lg font-extrabold pt-1"><span>Total</span><span x-text="'₦' + grandTotal().toLocaleString()"></span></div>
      </div>

      <form method="post" action="{% url 'sales:complete_sale' %}" @submit="beforeSubmit">
        {% csrf_token %}
        <input type="hidden" name="cart_json" x-ref="cartJson">
        <input type="hidden" name="customer_name" :value="customerName">
        <input type="hidden" name="customer_phone" :value="customerPhone">
        <input type="hidden" name="payment_method" :value="paymentMethod">
        <input type="hidden" name="manual_discount_amount" :value="manualDiscount || 0">
        <input type="hidden" name="manual_discount_reason" :value="manualDiscountReason">
        <input type="hidden" name="amount_paid" :value="amountPaid || grandTotal()">
        <button type="submit" class="btn btn-primary w-full mt-3 text-base py-3" :disabled="cart.length === 0">
          Complete Sale
        </button>
      </form>
    </div>
  </div>
</div>

<script>
function posApp() {
  return {
    allProducts: [],
    query: "",
    cart: [],
    customerName: "",
    customerPhone: "",
    paymentMethod: "{{ payment_methods.0.0 }}",
    manualDiscount: 0,
    manualDiscountReason: "",
    amountPaid: 0,
    uidCounter: 1,

    init() {
      this.allProducts = JSON.parse(document.getElementById('products-data').textContent);
    },
    filteredProducts() {
      const q = this.query.trim().toLowerCase();
      if (!q) return this.allProducts;
      return this.allProducts.filter(p => p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q));
    },
    addToCart(p) {
      const line = {
        uid: this.uidCounter++,
        product_id: p.id, name: p.name,
        unit_type: 'PACK', quantity: 1,
        unit_price: p.pack_price, gross_amount: p.pack_price, discount_amount: 0, net_amount: p.pack_price,
      };
      this.cart.push(line);
      this.refreshLine(line);
    },
    removeLine(idx) { this.cart.splice(idx, 1); },
    async refreshLine(line) {
      if (line.quantity < 1) line.quantity = 1;
      try {
        const res = await fetch(`/api/sales/preview-line/?product_id=${line.product_id}&unit_type=${line.unit_type}&quantity=${line.quantity}`);
        const data = await res.json();
        if (!data.error) {
          line.unit_price = data.unit_price;
          line.gross_amount = data.gross_amount;
          line.discount_amount = data.discount_amount;
          line.net_amount = data.net_amount;
        }
      } catch (e) { /* network hiccup - values keep last known state */ }
    },
    subtotal() { return this.cart.reduce((s, l) => s + Number(l.gross_amount || 0), 0); },
    totalDiscount() {
      const lineDiscount = this.cart.reduce((s, l) => s + Number(l.discount_amount || 0), 0);
      return lineDiscount + Number(this.manualDiscount || 0);
    },
    grandTotal() {
      const t = this.subtotal() - this.totalDiscount();
      return t > 0 ? t : 0;
    },
    beforeSubmit() {
      const payload = this.cart.map(l => ({ product_id: l.product_id, unit_type: l.unit_type, quantity: l.quantity }));
      this.$refs.cartJson.value = JSON.stringify(payload);
    },
  }
}
</script>
{% endblock %}
